<div class="notifications-container">
  <button class="notification-toggle" (click)="toggleNotifications()">
    <i class="material-icons">notifications</i>
    <span *ngIf="unreadCount > 0" class="notification-badge">{{ unreadCount }}</span>
  </button>
  
  <div class="notifications-panel" [class.show]="showNotifications">
    <div class="notifications-header">
      <h3>Notifications</h3>
      <div class="notifications-actions">
        <button class="action-button" (click)="markAllAsRead()" [disabled]="unreadCount === 0">
          Mark all as read
        </button>
        <button class="action-button" (click)="clearAll()" [disabled]="notifications.length === 0">
          Clear all
        </button>
      </div>
    </div>
    
    <div class="notifications-list">
      <div *ngFor="let notification of notifications" 
           class="notification-item" 
           [class.unread]="!notification.read"
           [class.info]="notification.type === 'info'"
           [class.success]="notification.type === 'success'"
           [class.warning]="notification.type === 'warning'"
           [class.error]="notification.type === 'error'"
           (click)="markAsRead(notification.id)">
        <div class="notification-icon">
          <i class="material-icons" *ngIf="notification.type === 'info'">info</i>
          <i class="material-icons" *ngIf="notification.type === 'success'">check_circle</i>
          <i class="material-icons" *ngIf="notification.type === 'warning'">warning</i>
          <i class="material-icons" *ngIf="notification.type === 'error'">error</i>
        </div>
        <div class="notification-content">
          <p class="notification-message">{{ notification.message }}</p>
          <span class="notification-time">{{ notification.timestamp | date:'short' }}</span>
        </div>
      </div>
      
      <div *ngIf="notifications.length === 0" class="empty-notifications">
        <p>No notifications</p>
      </div>
    </div>
  </div>
</div>
